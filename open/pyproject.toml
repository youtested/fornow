[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-py"
version = "0.1.0"
description = "A pure-Python reimplementation of the opencode coding agent, targeting 32-bit ARM (armv7) phones running Termux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "requests>=2.28",
    "rich>=13.0",
    "platformdirs>=4.0",
    "click>=8.1",
    "pygments>=2.16",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
dev = ["pytest>=8.0"]

[project.scripts]
opencode-py = "opencode_py.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencode_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
